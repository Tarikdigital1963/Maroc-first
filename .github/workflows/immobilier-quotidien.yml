name: Actualisation quotidienne Immobilier Maroc First
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-estate-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Importer les annonces depuis les flux partenaires autorisés
        env:
          REAL_ESTATE_FEED_URLS: ${{ secrets.REAL_ESTATE_FEED_URLS }}
        run: python3 scripts/refresh_real_estate.py
      - name: Publier les annonces actualisées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add immobilier.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle annonce ou aucun changement."
          else
            git commit -m "Actualisation quotidienne des annonces immobilières"
            git push
          fi
