name: Actualités Maroc First
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh_news.py"
      - ".github/workflows/actualites-quotidiennes.yml"
permissions:
  contents: write
concurrency:
  group: daily-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Construire l'archive des actualités
        run: python3 scripts/refresh_news.py
      - name: Publier les nouveaux titres sans effacer les anciens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualites.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau titre dans les flux."
          else
            git commit -m "Actualisation automatique des actualités"
            git push
          fi
